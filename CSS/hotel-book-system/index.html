<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Luxury <span>Hotel</span></div>
        <nav>
            <a href="#home">Home</a>
            <a href="#rooms">Rooms</a>
            <a href="#services">Services</a>
            <a href="#booking">Booking</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Welcome to Luxury Hotel</h1>
        <p>Experience comfort & elegance</p>
        <button onclick="scrollToBooking()">Book Now</button>
    </section>

    <section class="rooms" id="rooms">
        <h2>Our Rooms</h2>
        <div class="room-container">
            <div class="room-card">
                <h3>Deluxe room</h3>
                <p>₹3000 / night</p>
            </div>
            <div class="room-card">
                <h3>Luxury Room</h3>
                <p>₹5000 / night</p>
            </div>
            <div class="room-card">
                <h3>Suite Room</h3>
                <p>₹8000 / night</p>
            </div>
        </div>
    </section>

    <section class="booking" id="booking">
        <h2>Book Your Stay</h2>
        <form id="bookingForm">
            <input type="text" id="name" placeholder="Your Name">
            <input type="date" id="checkin">
            <input type="date" id="checkout">
            
            <select id="room">
                <option value="">Select Room</option>
                <option>Deluxe</option>
                <option>Luxury</option>
                <option>Suite</option>
                <option>vip Massage Room</option>
            </select>
            <button type="submit">Confirm Booking</button>
        </form>
        <p id="message"></p>
    </section>

    <footer>
        <p>© 2026 Luxury Hotel  | Designed by You</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
