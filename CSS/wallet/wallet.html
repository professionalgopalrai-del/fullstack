<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Wallet System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .wallet-box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px #ccc;
        }
        h2 {
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }
        button {
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .balance {
            font-size: 22px;
            margin-top: 15px;
            text-align: center;
            color: green;
        }
        .history {
            margin-top: 20px;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="wallet-box">
        <h2>Wallet System</h2>

        <div class="balance">Balance: ₹ <span id="balance">0</span></div>

        <input type="number" id="amount" placeholder="Enter amount">

        <button onclick="addMoney()">Add Money</button>
        <button onclick="spendMoney()">Spend Money</button>

        <h3>Transaction History</h3>
        <div class="history" id="history"></div>
    </div>

    <script>
        let balance = 0;

        function updateBalance() {
            document.getElementById("balance").innerText = balance;
        }

        function addHistory(text) {
            let historyBox = document.getElementById("history");
            historyBox.innerHTML += text + "<br>";
        }

        function addMoney() {
            let amount = Number(document.getElementById("amount").value);
            
            if (amount <= 0) {
                alert("Enter a valid amount!");
                return;
            }

            balance += amount;
            updateBalance();
            addHistory("Added: ₹" + amount);

            document.getElementById("amount").value = "";
        }

        function spendMoney() {
            let amount = Number(document.getElementById("amount").value);

            if (amount <= 0) {
                alert("Enter a valid amount!");
                return;
            }

            if (amount > balance) {
                alert("Insufficient balance!");
                return;
            }

            balance -= amount;
            updateBalance();
            addHistory("Spent: ₹" + amount);

            document.getElementById("amount").value = "";
        }
    </script>

</body>
</html>
