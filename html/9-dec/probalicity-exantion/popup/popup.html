<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h2>Productivity Dashboard</h2>

    <section>
        <input type="number" value="25">
        <button id="timer-start">Start</button>
        <button id="timer-stop">Stop</button>
        <p id="timer-display"></p>
        
    </section>

    <section>
        <h3>Block Sites</h3>
        <input type="text" placeholder="e.g instagram.com" >
        <button id="block-add-btn">Block</button>

        <ul id="block-website-list"></ul>
    </section>

    <section>
        <h3>Usages stats</h3>
        <ul id="usages-list"></ul>
        <li>Google.com</li>
        <li>Facebook.com</li>
    </section>
</body>
</html>
